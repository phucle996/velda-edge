# ==============================================================================
# Velda Edge — Kernel Parameter Tuning (Production High-Throughput Profile)
#
# Target File: /etc/sysctl.d/99-velda.conf
# Apply Command: sudo sysctl --system
#
# Sized for:
# - High-concurrency edge reverse proxying (100k+ concurrent connections)
# - HTTP/3 / QUIC UDP socket buffer scaling (prevents ENOBUFS & kernel drops)
# - Sub-millisecond TCP P99 tail latency & fast socket recycling
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. UDP & HTTP/3 (QUIC) Socket Buffer Scaling
# ------------------------------------------------------------------------------
# Default Linux receive buffer (208 KB / 212992 bytes) is severely undersized for
# high-throughput HTTP/3. Under bursts of 64KB UDP datagrams, queues fill in < 1ms
# causing kernel packet drops before userspace can drain them.
#
# Recommended: 16 MB (16777216 bytes) minimum for datacenter edge proxies.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# UDP memory pages auto-tuning (min, default, max in 4KB OS pages)
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# ------------------------------------------------------------------------------
# 2. Connection Backlog & Ingress Steering
# ------------------------------------------------------------------------------
# Maximum backlog queue depth for listen() sockets (SOMAXCONN).
# Prevents SYN packet drops during sudden traffic bursts.
net.core.somaxconn = 65535

# Maximum packets queued on the network card driver input side (softirq).
net.core.netdev_max_backlog = 65535

# Maximum number of remembered connection requests still waiting for client ACK.
net.ipv4.tcp_max_syn_backlog = 65535

# ------------------------------------------------------------------------------
# 3. TCP Buffer Auto-Tuning (Min, Default, Max in bytes)
# ------------------------------------------------------------------------------
# Auto-tuned TCP read/write windows up to 16 MB.
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# ------------------------------------------------------------------------------
# 4. Ephemeral Port Scaling & Fast Socket Recycling
# ------------------------------------------------------------------------------
# Expands outbound port range to maximize concurrent upstream multiplexing.
net.ipv4.ip_local_port_range = 1024 65535

# Fast reuse of TIME_WAIT sockets for outgoing connections without port exhaustion.
net.ipv4.tcp_tw_reuse = 1

# Shortens FIN-WAIT-2 state lifetime to rapidly reclaim orphaned sockets.
net.ipv4.tcp_fin_timeout = 15

# ------------------------------------------------------------------------------
# 5. Pacing & Congestion Control
# ------------------------------------------------------------------------------
# Fair Queueing (FQ) scheduler required for BBR pacing and microsecond jitter.
net.core.default_qdisc = fq

# BBR congestion control maintains high throughput over packet lossy networks.
net.ipv4.tcp_congestion_control = bbr

# ------------------------------------------------------------------------------
# 6. System-Wide Resource Limits
# ------------------------------------------------------------------------------
# Maximum open file descriptors system-wide (allows dense multi-worker proxying).
fs.file-max = 2097152
