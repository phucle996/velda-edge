[package]
name = "velda-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "velda-sync"
path = "src/main.rs"

[dependencies]
velda-core = { path = "../velda-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
prost = "0.13"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
flate2 = "1.0"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "sync"
harness = false



