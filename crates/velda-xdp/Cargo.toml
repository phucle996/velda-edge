[package]
name = "velda-xdp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velda-core = { path = "../velda-core" }
tokio = { version = "1.43", features = ["io-util", "sync", "macros", "rt", "rt-multi-thread", "net", "time"] }
bytes = "1.10"
thiserror = "2.0"
tracing = "0.1"
libc = "0.2"
parking_lot = "0.12"
rustc-hash = "2.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
