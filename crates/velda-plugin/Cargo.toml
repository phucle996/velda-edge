[package]
name = "velda-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velda-core = { path = "../velda-core" }
velda-grpc = { path = "../velda-grpc" }
velda-observability = { path = "../velda-observability" }
velda-sync = { path = "../velda-sync" }
velda-tls = { path = "../velda-tls" }
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.10"
httparse = "1.10"
tracing = "0.1"
thiserror = "2.0"
base64 = "0.22"
http = "1.2"
bitflags = "2.8"
rustc-hash = "2.1"
ring = "0.17"
regex = "1.13"
aho-corasick = "1.1"
flate2 = "1.1"
brotli = "7.0"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14.10"
