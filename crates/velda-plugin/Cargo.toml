[package]
name = "velda-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velda-core = { path = "../velda-core" }
velda-grpc = { path = "../velda-grpc" }
velda-observability = { path = "../velda-observability" }
velda-router = { path = "../velda-router" }
velda-upstream = { path = "../velda-upstream" }
velda-tls = { path = "../velda-tls" }
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
prost = "0.14"
h2 = "0.4"
bytes = "1.10"
httparse = "1.10"
tracing = "0.1"
thiserror = "2.0"
base64 = "0.23"
http = "1.2"
bitflags = "2.8"
rustc-hash = "2.1"
ring = "0.17"
regex = "1.13"
aho-corasick = "1.1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
brotli = "7.0"
zstd = "0.14"
itoa = "1.0"
libc = "0.2"
arc-swap = "1.7"
x509-parser = "0.18.1"
rcgen = "0.14.10"

[dev-dependencies]
tempfile = "3"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "with-serde", "logs", "metrics", "trace"] }
prost_otlp = { package = "prost", version = "0.14" }









