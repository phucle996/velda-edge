[package]
name = "velda-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velda-core = { path = "../velda-core" }
velda-grpc = { path = "../velda-grpc" }
velda-observability = { path = "../velda-observability" }
velda-router = { path = "../velda-router" }
velda-sync = { path = "../velda-sync" }
velda-tls = { path = "../velda-tls" }
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
h2 = "0.4"
bytes = "1.10"
httparse = "1.10"
tracing = "0.1"
thiserror = "2.0"
base64 = "0.23"
http = "1.2"
bitflags = "2.8"
rustc-hash = "2.1"
ring = "0.17"
regex = "1.13"
aho-corasick = "1.1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
brotli = "7.0"
zstd = "0.13"
itoa = "1.0"
libc = "0.2"
arc-swap = "1.7"
x509-parser = "0.18.1"
rcgen = "0.14.10"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "health_probe_machine_code_test"
path = "src/background/health_probe/harness/machine_code_test.rs"

[[test]]
name = "prometheus_exporter_machine_code_test"
path = "src/background/prometheus_exporter/harness/machine_code_test.rs"

[[test]]
name = "otlp_metrics_exporter_machine_code_test"
path = "src/background/otlp_metrics_exporter/harness/machine_code_test.rs"

[[test]]
name = "statsd_exporter_machine_code_test"
path = "src/background/statsd_exporter/harness/machine_code_test.rs"

[[test]]
name = "acme_cert_rotator_machine_code_test"
path = "src/background/acme_cert_rotator/harness/machine_code_test.rs"

[[test]]
name = "std_log_shipper_machine_code_test"
path = "src/background/std_log_shipper/harness/machine_code_test.rs"

[[test]]
name = "otlp_log_shipper_machine_code_test"
path = "src/background/otlp_log_shipper/harness/machine_code_test.rs"

[[test]]
name = "loki_log_shipper_machine_code_test"
