[package]
name = "velda-router"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velda-core = { path = "../velda-core" }
rustc-hash = "2.1"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
velda-sync = { path = "../velda-sync" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
arc-swap = "1.7"

[[bench]]
name = "single_thread_bench"
harness = false

[[bench]]
name = "multi_thread_bench"
harness = false

[[bench]]
name = "large_dataset_bench"
harness = false

[[bench]]
name = "adversarial_bench"
harness = false

[[bench]]
name = "memory_leak_bench"
harness = false
