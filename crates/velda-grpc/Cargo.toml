[package]
name = "velda-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velda-core = { path = "../velda-core" }
tokio = { version = "1.43", features = ["io-util", "sync", "macros", "rt", "net"] }
bytes = "1.10"
http = "1.2"
h2 = "0.4"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }

[[bench]]
name = "single_thread_bench"
harness = false

[[bench]]
name = "multi_thread_bench"
harness = false

[[bench]]
name = "adversarial_bench"
harness = false

[[bench]]
name = "memory_leak_bench"
harness = false
