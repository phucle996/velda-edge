[package]
name = "velda-composer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Composition/runtime boundary coordinating TLS and application protocol engines for Velda Edge"

[dependencies]
velda-core = { path = "../velda-core" }
velda-transport = { path = "../velda-transport" }
velda-tls = { path = "../velda-tls" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio = { version = "1.43", features = ["net", "io-util", "sync", "macros"] }
tracing = "0.1"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
arc-swap = "1.7"

[[bench]]
name = "single_thread_bench"
harness = false

[[bench]]
name = "multi_thread_bench"
harness = false

[[bench]]
name = "adversarial_bench"
harness = false

[[bench]]
name = "memory_leak_bench"
harness = false
