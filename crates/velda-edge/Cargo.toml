[package]
name = "velda-edge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "velda-edge"
path = "src/main.rs"

[dependencies]
velda-core = { path = "../velda-core" }
velda-transport = { path = "../velda-transport" }
velda-tls = { path = "../velda-tls" }
velda-http1 = { path = "../velda-http1" }
velda-http2 = { path = "../velda-http2" }
velda-http3 = { path = "../velda-http3" }
velda-grpc = { path = "../velda-grpc" }
velda-router = { path = "../velda-router" }
velda-upstream = { path = "../velda-upstream" }
velda-connection-pool = { path = "../velda-connection-pool" }
velda-discovery = { path = "../velda-discovery" }
velda-lb = { path = "../velda-lb" }
velda-sync = { path = "../velda-sync" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
arc-swap = "1.7"
http = "1.2"
bytes = "1.10"
h2 = "0.4"
rustc-hash = "2.1"
libc = "0.2"
socket2 = "0.6"

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dev-dependencies]
tempfile = "3"
rcgen = "0.14.10"

[[bench]]
name = "single_thread_bench"
harness = false

[[bench]]
name = "multi_thread_bench"
harness = false

[[bench]]
name = "adversarial_bench"
harness = false

[[bench]]
name = "memory_leak_bench"
harness = false

