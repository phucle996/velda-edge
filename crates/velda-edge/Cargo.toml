[package]
name = "velda-edge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "velda-edge"
path = "src/main.rs"

[dependencies]
velda-core = { path = "../velda-core" }
velda-transport = { path = "../velda-transport" }
velda-composer = { path = "../velda-composer" }
velda-tls = { path = "../velda-tls" }
velda-http = { path = "../velda-http" }
velda-router = { path = "../velda-router" }
velda-upstream = { path = "../velda-upstream" }
velda-sync = { path = "../velda-sync" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
arc-swap = "1.7"
http = "1.2"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14.10"
h2 = "0.4"

