[package]
name = "velda-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velda-core = { path = "../velda-core" }
tokio = { version = "1.43", features = ["net", "sync", "macros", "time", "rt", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
arc-swap = "1.7"
thiserror = "2.0"
getrandom = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
serde_json = "1.0"

[[bench]]
name = "single_thread_bench"
harness = false

[[bench]]
name = "multi_thread_bench"
harness = false

[[bench]]
name = "adversarial_bench"
harness = false

[[bench]]
name = "memory_leak_bench"
harness = false

[[bench]]
name = "wire_bench"
harness = false

