[package]
name = "velda-tls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velda-core = { path = "../velda-core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1"
rustls-pemfile = "2.2"
quinn-proto = { version = "0.11", default-features = false, features = ["rustls"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["io-util", "time"] }

[dev-dependencies]
rcgen = "0.14.10"
tokio = { version = "1.43", features = ["full", "test-util"] }

[[bench]]
name = "single_thread_bench"
harness = false

[[bench]]
name = "multi_thread_bench"
harness = false

[[bench]]
name = "adversarial_bench"
harness = false

[[bench]]
name = "memory_leak_bench"
harness = false

[[bench]]
name = "crypto_bench"
harness = false

