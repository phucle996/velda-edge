name: velda-edge-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: velda-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: velda_edge
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velda_edge"]
      interval: 3s
      timeout: 3s
      retries: 5

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile.dev
    container_name: velda-control-plane-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9099:9099"
    environment:
      - PORT=8080
      - GRPC_PORT=9099
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=velda_edge
      - DB_SSLMODE=disable
    volumes:
      - ./control-plane:/app
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: node:24-alpine
    container_name: velda-ui-dev
    working_dir: /app
    volumes:
      - ./ui:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - control-plane

volumes:
  postgres-dev-data:
