name: Release Linux

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  # ── Build Rust binary (velda-edge + velda-sync) ──────────────────
  build-edge:
    name: Build velda-edge (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - edition: amd64-v3
            target_cpu: x86-64-v3
            desc: "Cloud Performance Edition (AVX2, FMA, BMI1/2)"
          - edition: amd64-v2
            target_cpu: x86-64-v2
            desc: "Portable Compatibility Edition (SSE4.2, Popcnt)"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-rust-${{ runner.os }}-${{ matrix.edition }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-rust-${{ runner.os }}-${{ matrix.edition }}-

      - name: Build release binaries (${{ matrix.edition }})
        env:
          RUSTFLAGS: "-C target-cpu=${{ matrix.target_cpu }}"
        run: cargo build --release -p velda-edge -p velda-sync

      - name: Strip binaries
        run: |
          strip target/release/velda-edge
          strip target/release/velda-sync

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/velda-edge dist/
          cp target/release/velda-sync dist/
          cd dist && sha256sum * > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velda-edge-linux-${{ matrix.edition }}
          path: dist/

  # ── Build Go binary (velda-control-plane) ────────────────────────
  build-control-plane:
    name: Build velda-control-plane (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: control-plane/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Copy UI dist to control-plane
        run: cp -r ui/dist control-plane/internal/console/dist

      - name: Build control-plane binary
        working-directory: control-plane
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o ../dist/velda-control-plane ./cmd

      - name: Package artifacts
        run: |
          cd dist && sha256sum * > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velda-control-plane-linux-amd64
          path: dist/

  # ── Trivy binary scan ────────────────────────────────────────────
  trivy-binary-scan:
    name: Trivy Binary Scan
    runs-on: ubuntu-latest
    needs: [build-edge, build-control-plane]
    steps:
      - uses: actions/checkout@v4

      - name: Download edge artifacts
        uses: actions/download-artifact@v4
        with:
          name: velda-edge-linux-amd64-v3
          path: dist/edge

      - name: Download control-plane artifacts
        uses: actions/download-artifact@v4
        with:
          name: velda-control-plane-linux-amd64
          path: dist/cp

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  # ── Create GitHub Release ────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-edge, build-control-plane, trivy-binary-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Download edge artifacts (amd64-v3)
        uses: actions/download-artifact@v4
        with:
          name: velda-edge-linux-amd64-v3
          path: dist/edge-v3

      - name: Download edge artifacts (amd64-v2)
        uses: actions/download-artifact@v4
        with:
          name: velda-edge-linux-amd64-v2
          path: dist/edge-v2

      - name: Download control-plane artifacts
        uses: actions/download-artifact@v4
        with:
          name: velda-control-plane-linux-amd64
          path: dist/cp

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Edge binaries: v3 (Cloud Performance) and v2 (Portable Baseline)
          tar -czf release/velda-edge-linux-amd64-v3.tar.gz -C dist/edge-v3 velda-edge velda-sync SHA256SUMS
          tar -czf release/velda-edge-linux-amd64-v2.tar.gz -C dist/edge-v2 velda-edge velda-sync SHA256SUMS
          # Backward-compatible default alias (points to v2 for safest compatibility across legacy hosts)
          cp release/velda-edge-linux-amd64-v2.tar.gz release/velda-edge-linux-amd64.tar.gz
          # Control Plane binary
          tar -czf release/velda-control-plane-linux-amd64.tar.gz -C dist/cp velda-control-plane SHA256SUMS
          # Global checksums
          cd release && sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/velda-edge-linux-amd64-v3.tar.gz
            release/velda-edge-linux-amd64-v2.tar.gz
            release/velda-edge-linux-amd64.tar.gz
            release/velda-control-plane-linux-amd64.tar.gz
            release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
