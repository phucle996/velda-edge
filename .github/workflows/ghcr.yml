name: Release GHCR

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  EDGE_IMAGE: ghcr.io/${{ github.repository }}/velda-edge
  CP_IMAGE: ghcr.io/${{ github.repository }}/velda-control-plane

jobs:
  # ── Build & Push: velda-edge ─────────────────────────────────────
  edge-image:
    name: Build & Push velda-edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.EDGE_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.EDGE_IMAGE }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-edge.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-edge.sarif
          category: trivy-edge

  # ── Build & Push: velda-control-plane ────────────────────────────
  control-plane-image:
    name: Build & Push velda-control-plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CP_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.CP_IMAGE }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-cp.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-cp.sarif
          category: trivy-control-plane

  # ── Gate: All images must pass scan ──────────────────────────────
  ghcr-gate:
    name: GHCR Gate
    runs-on: ubuntu-latest
    needs: [edge-image, control-plane-image]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          if [[ "${{ needs.edge-image.result }}" != "success" ]] ||
             [[ "${{ needs.control-plane-image.result }}" != "success" ]]; then
            echo "❌ One or more image builds/scans failed."
            exit 1
          fi
          echo "✅ All GHCR images built, scanned, and pushed."
